
name: Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
          RUSTFS_ADDRESS: "0.0.0.0:9000"
        ports:
          - 9000:9000
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record pipeline start time
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          started_at = datetime.now(timezone.utc)

          Path("pipeline_started_at.txt").write_text(
              started_at.isoformat(),
              encoding="utf-8",
          )

          print(f"Pipeline started at: {started_at.isoformat()}")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: |
          python -m pip install pytest
          python -m pytest tests/ -m "not integration" -v

      - name: Wait for RustFS
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:9000/minio/health/live > /dev/null; then
              echo "RustFS is ready"
              exit 0
            fi
            echo "Waiting for RustFS..."
            sleep 2
          done
          echo "RustFS did not become ready"
          exit 1

      - name: Create RustFS bucket
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
        run: |
          python -m src.storage.ensure_bucket

      - name: Upload sample Bronze fixtures
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
        run: |
          python - <<'PY'
          import os
          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["RUSTFS_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUSTFS_SECRET_KEY"],
              region_name="us-east-1",
          )

          key = "bronze/api_football/league_39/season_2023/fixtures_sample.json"

          s3.upload_file(
              "tests/fixtures/api_football_sample.json",
              os.environ["S3_BUCKET"],
              key,
          )

          print(f"Sample Bronze data uploaded: {key}")
          PY

      - name: Transform Bronze to Silver
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
          LEAGUE_ID: "39"
          SEASON: "2023"
        run: |
          python -m src.processing.transform_api_football

      - name: Verify Silver Parquet
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
        run: |
          python - <<'PY'
          import io
          import os

          import boto3
          import pandas as pd

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["RUSTFS_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUSTFS_SECRET_KEY"],
              region_name="us-east-1",
          )

          key = "silver/api_football/league_39/season_2023/fixtures.parquet"

          response = s3.get_object(
              Bucket=os.environ["S3_BUCKET"],
              Key=key,
          )

          df = pd.read_parquet(io.BytesIO(response["Body"].read()))

          assert len(df) == 2, f"Expected 2 fixtures, got {len(df)}"
          assert set(df["fixture_id"]) == {900001, 900002}

          print("Silver validation passed: 2 fixtures")
          PY

      - name: Apply PostgreSQL schema and migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/create_fixtures.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/001_add_multi_source_support.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/002_add_fixtures_constraints.sql

      - name: Load Silver fixtures into PostgreSQL
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
          LEAGUE_ID: "39"
          SEASON: "2023"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: |
          python -m src.warehouse.load_to_postgres --source api_football

      - name: Verify loaded fixtures in PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT fixture_id, home_team, away_team
                      FROM fixtures
                      WHERE source = %s
                        AND league_id = %s
                        AND season = %s
                      ORDER BY fixture_id;
                      """,
                      ("api_football", 39, 2023),
                  )

                  rows = cursor.fetchall()

          assert len(rows) == 2, f"Expected 2 fixtures, got {len(rows)}"
          assert [row[0] for row in rows] == [900001, 900002]

          print("PostgreSQL validation passed: 2 fixtures")
          for row in rows:
              print(row)
          PY


      - name: Test football-data.org Bronze to PostgreSQL
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
          COMPETITION_CODE: PL
          SEASON: "2023"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          import boto3
          import psycopg

          # Synthetic football-data.org response.
          # ID 900001 intentionally overlaps with API-Football.
          matches = []

          for fixture_id, home_id, away_id, home_goals, away_goals in [
              (900001, 2001, 2002, 2, 0),
              (900003, 2003, 2004, 1, 1),
          ]:
              matches.append({
                  "id": fixture_id,
                  "utcDate": "2023-08-12T15:00:00Z",
                  "status": "FINISHED",
                  "matchday": 1,
                  "competition": {"id": 2021},
                  "season": {"startDate": "2023-08-01"},
                  "homeTeam": {
                      "id": home_id,
                      "name": f"Home {home_id}"
                  },
                  "awayTeam": {
                      "id": away_id,
                      "name": f"Away {away_id}"
                  },
                  "score": {
                      "fullTime": {
                          "home": home_goals,
                          "away": away_goals
                      }
                  },
              })

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["RUSTFS_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUSTFS_SECRET_KEY"],
              region_name="us-east-1",
          )

          bronze_key = (
              "bronze/football_data/competition_PL/"
              "season_2023/fixtures_sample.json"
          )

          s3.put_object(
              Bucket=os.environ["S3_BUCKET"],
              Key=bronze_key,
              Body=json.dumps({"matches": matches}).encode("utf-8"),
              ContentType="application/json",
          )

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "src.processing.transform_football_data",
              ],
              check=True,
          )

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "src.warehouse.load_to_postgres",
                  "--source",
                  "football_data",
                  "--competition",
                  "PL",
                  "--season",
                  "2023",
              ],
              check=True,
          )

          with psycopg.connect(
              host="localhost",
              port=5432,
              dbname="test_db",
              user="test_user",
              password="test_password",
          ) as conn:
              with conn.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT source, fixture_id
                      FROM public.fixtures
                      ORDER BY source, fixture_id
                      """
                  )
                  rows = cursor.fetchall()

          assert rows == [
              ("api_football", 900001),
              ("api_football", 900002),
              ("football_data", 900001),
              ("football_data", 900003),
          ], f"Unexpected fixtures: {rows}"

          print("PASS: both sources loaded into PostgreSQL")
          print("PASS: overlapping fixture IDs coexist")
          PY


      - name: Verify incomplete Silver cannot replace fixtures
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: football-data
          RUSTFS_ACCESS_KEY: test_access_key
          RUSTFS_SECRET_KEY: test_secret_key_123
          LEAGUE_ID: "39"
          SEASON: "2023"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        run: |
          python - <<'PY'
          import io
          import os
          import subprocess
          import sys

          import boto3
          import pandas as pd
          import psycopg

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["RUSTFS_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUSTFS_SECRET_KEY"],
              region_name="us-east-1",
          )

          bucket = os.environ["S3_BUCKET"]
          key = (
              "silver/api_football/league_39/"
              "season_2023/fixtures.parquet"
          )

          original = s3.get_object(
              Bucket=bucket, Key=key
          )["Body"].read()

          df = pd.read_parquet(io.BytesIO(original))

          assert len(df) == 2
          assert set(df["fixture_id"]) == {900001, 900002}

          incomplete = df[df["fixture_id"] == 900001]

          buffer = io.BytesIO()
          incomplete.to_parquet(buffer, index=False)

          
          try:
            s3.put_object(
                Bucket=bucket,
                Key=key,
                Body=buffer.getvalue(),
            )

            result = subprocess.run(
                [
                    sys.executable,
                    "-m",
                    "src.warehouse.load_to_postgres",
                    "--source",
                    "api_football",
                ],
                capture_output=True,
                text=True,
                check=False,
            )

            output = result.stdout + result.stderr

            assert result.returncode != 0, (
                "Loader unexpectedly accepted incomplete Silver."
            )

            assert "Unsafe replacement blocked" in output, (
                "Loader failed, but not because of load_guard:\n"
                + output
            )

            with psycopg.connect(
                host="localhost",
                port=5432,
                dbname="test_db",
                user="test_user",
                password="test_password",
            ) as conn:
                with conn.cursor() as cursor:
                    cursor.execute(
                        """
                        SELECT fixture_id
                        FROM public.fixtures
                        WHERE source = 'api_football'
                        AND league_id = 39
                        AND season = 2023
                        ORDER BY fixture_id
                        """
                    )

                    ids = [
                        row[0]
                        for row in cursor.fetchall()
                    ]

            assert ids == [900001, 900002], (
                f"PostgreSQL data changed: {ids}"
            )

            print("PASS: incomplete Silver rejected")
            print("PASS: both original fixtures preserved")

          finally:
            s3.put_object(
                Bucket=bucket,
                Key=key,
                Body=original,
            )

          PY

      - name: Verify PostgreSQL rejects invalid scores
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          import psycopg
          from psycopg import errors

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  try:
                      cursor.execute("SAVEPOINT invalid_score_test")

                      cursor.execute(
                          """
                          UPDATE public.fixtures
                          SET home_goals = -1
                          WHERE source = %s
                            AND fixture_id = %s
                          """,
                          ("api_football", 900001),
                      )
                  except errors.CheckViolation:
                      cursor.execute(
                          "ROLLBACK TO SAVEPOINT invalid_score_test"
                      )
                      print("PASS: PostgreSQL rejected negative goals")
                  else:
                      raise AssertionError(
                          "FAIL: PostgreSQL accepted negative goals"
                      )

              conn.rollback()
          PY

      - name: Create Gold views
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/gold_team_stats.sql
          psql -v ON_ERROR_STOP=1 -f sql/gold_team_recent_form.sql

      - name: Verify Gold views
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  for view in ("gold_team_stats", "gold_team_recent_form"):
                      cursor.execute(
                          f"""
                          SELECT team_id, played, wins, draws, losses, points
                          FROM {view}
                          WHERE source = %s
                            AND league_id = %s
                            AND season = %s
                          ORDER BY team_id;
                          """,
                          ("api_football", 39, 2023),
                      )

                      rows = cursor.fetchall()

                      expected = [
                          (1001, 1, 1, 0, 0, 3),
                          (1002, 1, 0, 0, 1, 0),
                          (1003, 1, 0, 1, 0, 1),
                          (1004, 1, 0, 1, 0, 1),
                      ]

                      assert rows == expected, (
                          f"Unexpected results in {view}: {rows}"
                      )

                      print(f"{view}: validation passed (4 teams)")
          PY

      - name: Run SQL Data Quality checks
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          expected_checks = {
              "duplicate_fixture_ids",
              "invalid_finished_fixtures",
              "inconsistent_team_stats",
              "invalid_team_identifiers",
          }

          sql = Path("sql/data_quality_checks.sql").read_text(
              encoding="utf-8"
          )

          queries = [
              query.strip()
              for query in sql.split(";")
              if query.strip()
          ]

          results = {}

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  for query in queries:
                      cursor.execute(query)
                      row = cursor.fetchone()

                      if row is None:
                          raise RuntimeError(
                              "Data Quality query returned no result"
                          )

                      check_name, failures = row

                      if check_name in results:
                          raise RuntimeError(
                              f"Duplicate check: {check_name}"
                          )

                      results[check_name] = failures
                      print(f"{check_name}: {failures} failures")

          if set(results) != expected_checks:
              missing = expected_checks - set(results)
              unexpected = set(results) - expected_checks

              raise RuntimeError(
                  f"Invalid Data Quality checks. "
                  f"Missing: {missing}, unexpected: {unexpected}"
              )

          failed_checks = {
              name: count
              for name, count in results.items()
              if not isinstance(count, int) or count != 0
          }

          if failed_checks:
              raise RuntimeError(
                  f"Data Quality validation failed: {failed_checks}"
              )

          print("All 4 SQL Data Quality checks passed")
          PY

      - name: Verify Data Quality detects invalid scores
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          sql = Path("sql/data_quality_checks.sql").read_text(
              encoding="utf-8"
          )

          queries = [
              query.strip()
              for query in sql.split(";")
              if query.strip()
          ]

          with psycopg.connect() as conn:
              try:
                  with conn.cursor() as cursor:
                      cursor.execute(
                          """
                          CREATE TEMP TABLE fixtures
                          AS TABLE public.fixtures;
                          """
                        )
                      cursor.execute(
                          """
                          UPDATE fixtures
                          SET home_goals = -1
                          WHERE source = %s
                            AND fixture_id = %s;
                          """,
                          ("api_football", 900001),
                      )

                      assert cursor.rowcount == 1

                      detected = False

                      for query in queries:
                          cursor.execute(query)
                          check_name, failures = cursor.fetchone()

                          if check_name == "invalid_finished_fixtures":
                              assert failures > 0
                              detected = True

                      assert detected, "Invalid scores were not detected"

                      print("Data Quality correctly detected invalid scores")
              finally:
                  conn.rollback()
          PY

      - name: Generate Data Quality report
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg

          from src.processing.data_quality_report import generate_data_quality_report

          sql = Path("sql/data_quality_checks.sql").read_text(
              encoding="utf-8"
          )

          queries = [
              query.strip()
              for query in sql.split(";")
              if query.strip()
          ]

          expected_names = {
              "duplicate_fixture_ids",
              "invalid_finished_fixtures",
              "inconsistent_team_stats",
              "invalid_team_identifiers",
          }

          checks = []

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  for query in queries:
                      cursor.execute(query)
                      check_name, failures = cursor.fetchone()

                      checks.append({
                          "name": check_name,
                          "status": "PASS" if failures == 0 else "FAIL",
                          "failures": failures,
                      })

          actual_names = [check["name"] for check in checks]

          if len(checks) != 4 or set(actual_names) != expected_names:
              raise RuntimeError(
                  f"Unexpected Data Quality checks: {actual_names}"
              )

          report = generate_data_quality_report(checks)

          print("Data Quality report generated")
          print(f"Overall status: {report['overall_status']}")
          print(f"Total checks: {report['total_checks']}")
          print(f"Failed checks: {report['failed_checks']}")

          if report["overall_status"] != "PASS":
              raise RuntimeError("Data Quality report contains failures")
          PY

      - name: Upload Data Quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-data-quality-report
          path: reports/data_quality_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify PostgreSQL connection
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -p 5432 -U test_user -d test_db -c "SELECT 1;"

      - name: Verify PostgreSQL connection with Python
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  cursor.execute("SELECT 1;")
                  result = cursor.fetchone()

          assert result == (1,), f"Unexpected result: {result}"
          print("Python connected to PostgreSQL successfully")
          PY

      - name: Verify workflow
        run: echo "Pipeline workflow is ready"

      - name: Generate pipeline execution report
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test_user
          PGPASSWORD: test_password
          PGDATABASE: test_db
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          import psycopg

          from src.processing.pipeline_report import generate_pipeline_report

          started_at = datetime.fromisoformat(
              Path("pipeline_started_at.txt").read_text(
                  encoding="utf-8"
              ).strip()
          )

          with psycopg.connect() as conn:
              with conn.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT COUNT(*)
                      FROM fixtures
                      WHERE source = %s
                        AND league_id = %s
                        AND season = %s;
                      """,
                      ("api_football", 39, 2023),
                  )
                  fixtures_count = cursor.fetchone()[0]

                  cursor.execute(
                      """
                      SELECT COUNT(*)
                      FROM gold_team_stats
                      WHERE source = %s
                        AND league_id = %s
                        AND season = %s;
                      """,
                      ("api_football", 39, 2023),
                  )
                  teams_count = cursor.fetchone()[0]

          dq_report = json.loads(
              Path("reports/data_quality_report.json").read_text(
                  encoding="utf-8"
              )
          )

          assert fixtures_count == 2, (
              f"Expected 2 fixtures, got {fixtures_count}"
          )
          assert teams_count == 4, (
              f"Expected 4 teams, got {teams_count}"
          )
          assert dq_report["overall_status"] == "PASS"
          assert dq_report["total_checks"] == 4
          assert dq_report["failed_checks"] == 0

          finished_at = datetime.now(timezone.utc)

          stages = {
              "bronze": {
                  "status": "PASS",
                  "fixtures": 2,
              },
              "silver": {
                  "status": "PASS",
                  "fixtures": 2,
              },
              "postgresql": {
                  "status": "PASS",
                  "fixtures": fixtures_count,
              },
              "gold": {
                  "status": "PASS",
                  "teams": teams_count,
              },
              "data_quality": {
                  "status": dq_report["overall_status"],
                  "checks": dq_report["total_checks"],
                  "failed_checks": dq_report["failed_checks"],
              },
          }

          report = generate_pipeline_report(
              status="SUCCESS",
              started_at=started_at,
              finished_at=finished_at,
              league_id=39,
              season=2023,
              stages=stages,
          )

          print(json.dumps(report, indent=2))
          PY

      - name: Upload pipeline execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-pipeline-execution-report
          path: reports/pipeline_report_league_39_season_2023.json
          if-no-files-found: warn
          retention-days: 30
