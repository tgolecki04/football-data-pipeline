
name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest -v -m "not integration"

      
      - name: Seed test database
        run: |
          python -c "import os, pathlib, psycopg; conn = psycopg.connect(host='localhost', port=5432, dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD']); conn.execute(pathlib.Path('sql/test_seed.sql').read_text(encoding='utf-8')); conn.execute(pathlib.Path('sql/gold_team_stats.sql').read_text(encoding='utf-8')); conn.commit(); conn.close()"

      - name: Run PostgreSQL integration tests
        run: |
          python -m pytest -v -m integration

